<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Auto Summarizer 설정</title>
  <style>
    body { font-family: system-ui; padding: 20px; }
    label { display:block; margin: 12px 0 6px; font-weight:600; }
    input, select { width: 360px; padding: 8px; }
    button { margin-top: 14px; padding: 8px 12px; }
  </style>
</head>
<body>
  <h2>Auto Summarizer 설정</h2>

  <div style="margin-bottom: 24px; padding: 16px; background: #f5f5f5; border-radius: 8px;">
    <label style="display: flex; align-items: center; cursor: pointer; font-size: 16px;">
      <input id="enableExtension" type="checkbox" style="width: 24px; height: 24px; margin-right: 10px; cursor: pointer;" />
      <span>확장 프로그램 활성화</span>
    </label>
    <div style="font-size: 12px; color: #666; margin-top: 4px; margin-left: 34px;">끄면 모든 페이지에서 요약이 비활성화됩니다</div>
  </div>

  <label>OpenAI API Key</label>
  <input id="openaiKey" type="password" placeholder="sk-..." />

  <label>모델명</label>
  <input id="modelName" type="text" value="gpt-4o-mini" />

  <label>지연 시간 (ms)</label>
  <input id="autoDelayMs" type="number" value="3000" />

  <label>요약 최대 토큰</label>
  <input id="maxTokens" type="number" value="800" />

  <label>언어</label>
  <select id="lang">
    <option value="ko" selected>한국어</option>
    <option value="en">English</option>
  </select>

  <div style="margin-top:8px;">
    <label><input id="enableAuto" type="checkbox" checked /> 자동 요약 활성화 (확장 프로그램이 켜져있을 때만 적용)</label>
  </div>

  <button id="saveBtn">저장</button>
  <span id="status" style="margin-left:8px;"></span>

  <script src="options.js"></script>
</body>
</html>
